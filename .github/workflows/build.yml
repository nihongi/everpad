# Windows 版・macOS 版・Linux 版を GitHub Actions で作る。
# 動かし方: GitHub の Actions タブ →「Build (Windows / macOS / Linux)」→「Run workflow」。v で始まるタグ(v0.18.0 など)を push したときも動く。
# できたファイル(インストーラーと portable 版、dmg、AppImage)は、実行結果のページの Artifacts からダウンロードできる(30日間)。
# GitHub Releases への公開はしない。
# Mac 版には ad-hoc 署名(Apple の証明書を使わない簡易の署名)を付ける。
# 作ったあとに一度起動して、数秒たっても落ちていないか確かめ、画面のスクリーンショットを Artifacts に残す。
# Windows は、インストーラーで画面を出さずにインストール・アンインストールして、設定とメモが残ることも確かめる(tools/ci-smoke-windows.ps1)。
# 失敗の内容と確認の結果は、サインインしなくても見られる注釈(Annotations)にも書く。

name: Build (Windows / macOS / Linux)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest    # Apple シリコンの Mac。Intel 用(x64)の dmg もここで作る
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          mkdir -p smoke
          set +e
          npm test > smoke/test.log 2>&1
          status=$?
          set -e
          tail -n 15 smoke/test.log
          if [ $status -ne 0 ]; then
            # 失敗したテストと、その理由を注釈に書く
            msg=$(grep -E "^not ok|^✖|AssertionError|expected|actual|Error:" smoke/test.log | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failures (${{ matrix.name }})::$msg"
            exit 1
          fi

      # 実行した OS 用のファイルを作る(package.json の build.win / build.mac / build.linux)。公開はしない
      - name: Build
        run: npm run dist -- --publish never

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci-smoke-windows.ps1 -Dist dist -Out smoke

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p smoke
          # 注釈に、ファイルの最後の行を書く
          annotate() { local msg; msg=$(tail -n 30 "$3" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::$1 title=$2::$msg"; }
          APP="$(ls -d dist/mac-arm64/*.app | head -1)"
          echo "App: $APP"
          # ad-hoc 署名(package.json の mac.identity が "-")が、アプリ全体に正しく付いているか
          codesign -dv "$APP" > smoke/codesign-info.txt 2>&1 || true
          annotate notice "codesign -dv" smoke/codesign-info.txt
          if codesign --verify --deep --strict --verbose=2 "$APP" > smoke/codesign.txt 2>&1; then annotate notice "codesign --verify: OK" smoke/codesign.txt
          else annotate error "codesign --verify: failed" smoke/codesign.txt; exit 1; fi
          "$APP/Contents/MacOS/EverPad" > smoke/macos.log 2>&1 &
          PID=$!
          sleep 25
          screencapture -x smoke/screenshot-macos.png || echo "::warning::screenshot failed"
          if kill -0 "$PID" 2>/dev/null; then
            echo "::notice title=Smoke test (macOS)::EverPad was still running after 25 seconds"
            kill "$PID" || true
          else
            annotate error "EverPad exited during the smoke test (macOS)" smoke/macos.log
            exit 1
          fi

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p smoke
          annotate() { local msg; msg=$(tail -n 30 "$3" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::$1 title=$2::$msg"; }
          # 起動したもの(AppImage の展開役と Electron のプロセスすべて)を止めて、本当に終わるまで待つ。
          # 前のものが残っていると、EverPad の「起動は1つだけ」の仕組みで、次に起動したものがすぐ終わってしまう
          stop_all() {
            kill -TERM -- "-$1" 2>/dev/null || true
            for i in $(seq 1 20); do pgrep -g "$1" > /dev/null || break; sleep 1; done
            kill -KILL -- "-$1" 2>/dev/null || true
            pkill -KILL -f appimage_extracted 2>/dev/null || true
            sleep 1
          }
          sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          sleep 2
          # 動かす人の環境に FUSE 2 が無くても動くよう、展開して動かす
          export APPIMAGE_EXTRACT_AND_RUN=1
          IMG="$(ls dist/*.AppImage | head -1)"
          chmod +x "$IMG"
          echo "AppImage: $IMG"
          # 1. --no-sandbox なし(Ubuntu 24.04 以降では起動しないことがある。結果を知らせるだけ)
          setsid "$IMG" > smoke/linux-sandbox.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then echo "::notice title=Smoke test (Linux)::Without --no-sandbox, EverPad was running after 15 seconds"
          else annotate warning "Without --no-sandbox, EverPad exited" smoke/linux-sandbox.log; fi
          stop_all "$PID"
          # 2. --no-sandbox あり(こちらは起動しなければ失敗)
          setsid "$IMG" --no-sandbox > smoke/linux.log 2>&1 &
          PID=$!
          sleep 25
          import -window root smoke/screenshot-linux.png || echo "::warning::screenshot failed"
          if kill -0 "$PID" 2>/dev/null; then
            echo "::notice title=Smoke test (Linux)::With --no-sandbox, EverPad was running after 25 seconds"
            stop_all "$PID"
          else
            annotate error "EverPad exited during the smoke test (Linux, --no-sandbox)" smoke/linux.log
            exit 1
          fi
          # AppImage は portable 版と同じく、隣の「EverPad Data」に保存するはず
          if [ -d "dist/EverPad Data/notes" ]; then echo "::notice title=Smoke test (Linux)::EverPad Data was created next to the AppImage"
          else ls -la dist > smoke/dist.txt; annotate error "EverPad Data was not created next to the AppImage" smoke/dist.txt; exit 1; fi

      - name: Upload builds
        uses: actions/upload-artifact@v7
        with:
          name: everpad-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.name }}
          path: smoke/
          if-no-files-found: ignore
          retention-days: 30
